services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nightingale_pilot
      POSTGRES_USER: nightingale
      POSTGRES_PASSWORD: ${PILOT_ADMIN_DB_PASSWORD:?Set PILOT_ADMIN_DB_PASSWORD in pilot-runtime/.env}
    ports:
      - "5434:5432"
    volumes:
      - pilot_postgres:/var/lib/postgresql/data
volumes:
  pilot_postgres:
